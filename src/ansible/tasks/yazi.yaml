---
# Yazi file manager + optional preview dependencies.
#   macOS  -> Homebrew
#   Debian -> apt deps + upstream yazi .deb (amd64 or arm64)

- name: "Install optional Yazi dependencies (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ yazi.apt_packages }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - yazi
    - cli-tools

- name: "Ensure fd is symlinked as fd (Debian)"
  become: true
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
    force: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - yazi

- name: "Install Yazi from upstream .deb (Debian)"
  become: true
  ansible.builtin.apt:
    deb: "{{ yazi.deb_url }}"
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - yazi
  register: yazi_deb
  retries: 3
  delay: 30
  until: yazi_deb is succeeded

# The pre-.deb install unzipped yazi/ya into ~/.local/bin, which shadows /usr/bin.
- name: "Remove legacy Yazi release binaries (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
    state: absent
  loop: [yazi, ya]
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cleanup
    - yazi

- name: "Install Yazi and dependencies (macOS)"
  community.general.homebrew:
    name: "{{ yazi.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - yazi
