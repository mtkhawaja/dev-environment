---
- name: "Install GNU Stow (Debian)"
  become: true
  ansible.builtin.apt:
    name: stow
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - dotfiles

- name: "Install GNU Stow (macOS)"
  community.general.homebrew:
    name: "{{ dotfiles.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - dotfiles

- name: "Check if .dotfiles directory exists"
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.dotfiles"
  register: dotfiles_dir
  tags:
    - dotfiles

- name: "Archive local dotfiles if uncommitted changes exist"
  ansible.builtin.shell: |
    cd "$HOME/.dotfiles" && \
    git diff --quiet || \
    tar czf "$HOME/dotfiles-backup-$(date +%Y%m%d-%H%M%S).tar.gz" .
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: dotfiles_dir.stat.exists
  tags:
    - dotfiles

- name: "Clone dotfiles (force overwrite any local changes)"
  ansible.builtin.git:
    repo: 'https://github.com/mtkhawaja/dotfiles.git'
    dest: "{{ lookup('env', 'HOME') }}/.dotfiles"
    recursive: true
    update: true
    accept_hostkey: true
    version: main
    force: true
  tags:
    - dotfiles
  register: dotfiles_clone
  retries: 3
  delay: 30
  until: dotfiles_clone is succeeded

- name: "Stow dotfiles"
  ansible.builtin.command: ./setup.sh
  args:
    chdir: "{{ ansible_facts.env.HOME }}/.dotfiles"
  changed_when: true
  tags:
    - dotfiles
