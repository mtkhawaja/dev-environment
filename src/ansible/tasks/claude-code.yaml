---
# Claude Code (cross-platform: macOS + Debian/WSL). Official installer -> ~/.local/bin/claude.
# Self-updating CLI with no apt package, so the native installer is used on both
# OSes (matching the nvm/bun/uv/sdkman installer pattern). The installer does
# not edit rc files; ~/.local/bin is already on PATH (set in the dotfiles).

- name: "Install Claude Code"
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: Claude Code
    installer_url: https://claude.ai/install.sh
    installer_creates: "{{ ansible_facts.env.HOME }}/.local/bin/claude"
  tags:
    - initial-setup
    - claude-code
