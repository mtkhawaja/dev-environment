---
# OpenTofu (Terraform fork). Unpinned on both platforms to track latest.
#   macOS  -> Homebrew (opentofu formula)
#   Debian -> official OpenTofu apt repo (deb822 .sources), `tofu` package

# ---------- macOS ----------
- name: "Install OpenTofu (macOS)"
  community.general.homebrew:
    name: "{{ opentofu.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - opentofu

# ---------- Debian / WSL ----------
# Older runs wrote a one-line .list with its own keyrings; apt rejects two
# entries for the same repo with different Signed-By, so drop them first.
- name: "Remove legacy OpenTofu .list repository (Debian)"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/opentofu.list
    - /etc/apt/keyrings/opentofu.gpg
    - /etc/apt/keyrings/opentofu-repo.gpg
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cleanup
    - opentofu

- name: "Ensure python3-debian is present for deb822_repository (Debian)"
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - opentofu

- name: "Add OpenTofu apt repository (Debian)"
  become: true
  ansible.builtin.deb822_repository:
    name: opentofu
    types: deb
    uris: "{{ opentofu.apt_repo_uri }}"
    suites: any
    components: main
    signed_by: "{{ opentofu.apt_repo_key_url }}"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - opentofu
  register: opentofu_repo
  retries: 3
  delay: 30
  until: opentofu_repo is succeeded

- name: "Install OpenTofu (Debian)"
  become: true
  ansible.builtin.apt:
    name: tofu
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - opentofu
