---
- name: Provision the development environment
  hosts: localhost
  connection: local
  vars_files:
    - src/ansible/vars/main.yml
  pre_tasks:
    - name: Base packages
      ansible.builtin.import_tasks: src/ansible/tasks/pre_tasks.yaml
    - name: Standard directories
      ansible.builtin.import_tasks: src/ansible/tasks/directories.yaml

  tasks:
    - name: Automatic updates (Linux)
      ansible.builtin.import_tasks: src/ansible/tasks/auto-updates.yaml
    - name: SSH
      ansible.builtin.import_tasks: src/ansible/tasks/ssh.yaml
    - name: Zsh + oh-my-zsh
      ansible.builtin.import_tasks: src/ansible/tasks/zsh.yaml
    - name: Dotfiles
      ansible.builtin.import_tasks: src/ansible/tasks/dotfiles.yaml
    - name: CLI tools
      ansible.builtin.import_tasks: src/ansible/tasks/tools.yaml
    - name: SDKMAN
      ansible.builtin.import_tasks: src/ansible/tasks/sdkman.yaml
    - name: Neovim
      ansible.builtin.import_tasks: src/ansible/tasks/neovim.yaml
    - name: Java
      ansible.builtin.import_tasks: src/ansible/tasks/java.yaml
    - name: Node.js
      ansible.builtin.import_tasks: src/ansible/tasks/js.yaml
    - name: Bun
      ansible.builtin.import_tasks: src/ansible/tasks/bun.yaml
    - name: Bitwarden CLI
      ansible.builtin.import_tasks: src/ansible/tasks/bitwarden-cli.yaml
    - name: Python
      ansible.builtin.import_tasks: src/ansible/tasks/python.yaml
    - name: Yazi
      ansible.builtin.import_tasks: src/ansible/tasks/yazi.yaml
    - name: Go
      ansible.builtin.import_tasks: src/ansible/tasks/go.yaml
    - name: OpenTofu
      ansible.builtin.import_tasks: src/ansible/tasks/opentofu.yaml
    - name: Tflint
      ansible.builtin.import_tasks: src/ansible/tasks/tflint.yaml
    - name: AWS CLI
      ansible.builtin.import_tasks: src/ansible/tasks/awscli.yaml
    - name: GitHub CLI
      ansible.builtin.import_tasks: src/ansible/tasks/github-cli.yaml
    - name: SonarQube CLI
      ansible.builtin.import_tasks: src/ansible/tasks/sonarqube-cli.yaml
    - name: Atlassian CLI
      ansible.builtin.import_tasks: src/ansible/tasks/acli.yaml
    - name: Browser testing (Linux only)
      ansible.builtin.import_tasks: src/ansible/tasks/browser-testing.yaml
    - name: Modern CLI tools
      ansible.builtin.import_tasks: src/ansible/tasks/modern-cli.yaml
    - name: GUI apps
      ansible.builtin.import_tasks: src/ansible/tasks/apps.yaml
      when: not (headless | bool)
    - name: Claude Code
      ansible.builtin.import_tasks: src/ansible/tasks/claude-code.yaml
    - name: Tailscale (opt-in, -e tailscale=true)
      ansible.builtin.import_tasks: src/ansible/tasks/tailscale.yaml
      when: tailscale | bool
