---
# Neovim + tooling (tree-sitter CLI, stylua).
#   macOS  -> Homebrew
#   Debian -> apt (neovim) + tree-sitter and stylua release zips

- name: "Install Neovim (macOS)"
  community.general.homebrew:
    name: "{{ neovim.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - nvim

- name: "Install Neovim (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ neovim.apt_packages }}"
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

# Neovim used to be built from source into /usr/local, which would shadow the
# apt package on PATH.
- name: "Remove legacy source-built Neovim (Debian)"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_facts.env.HOME }}/neovim"
    - /usr/local/bin/nvim
    - /usr/local/share/nvim
    - /usr/local/lib/nvim
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cleanup
    - nvim

- name: "Ensure ~/.local/bin exists (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Install Neovim tooling release binaries: tree-sitter, stylua (Debian)"
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin"
    remote_src: true
    extra_opts: ["-j"]
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item.name }}"
  loop: "{{ neovim.release_binaries }}"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Ensure Neovim tooling binaries are executable (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item.name }}"
    mode: '0755'
    state: file
  loop: "{{ neovim.release_binaries }}"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim
