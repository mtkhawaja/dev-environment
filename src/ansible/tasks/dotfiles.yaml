---
- name: "Install GNU Stow (Debian)"
  become: true
  ansible.builtin.apt:
    name: stow
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - dotfiles

- name: "Install GNU Stow (macOS)"
  community.general.homebrew:
    name: "{{ dotfiles.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - dotfiles

- name: "Check if .dotfiles directory exists"
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.dotfiles"
  register: dotfiles_dir
  tags:
    - dotfiles

- name: "Archive local dotfiles if uncommitted changes exist"
  ansible.builtin.shell: |
    cd "$HOME/.dotfiles" && \
    git diff --quiet || \
    tar czf "$HOME/dotfiles-backup-$(date +%Y%m%d-%H%M%S).tar.gz" .
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: dotfiles_dir.stat.exists
  tags:
    - dotfiles

- name: "Clone dotfiles (force overwrite any local changes)"
  ansible.builtin.git:
    repo: 'https://github.com/mtkhawaja/dotfiles.git'
    dest: "{{ lookup('env', 'HOME') }}/.dotfiles"
    recursive: true
    update: true
    accept_hostkey: true
    version: main
    force: true
  tags:
    - dotfiles
  register: dotfiles_clone
  retries: 3
  delay: 30
  until: dotfiles_clone is succeeded

# The dotfiles' setup.sh always restows, so its exit status can't say whether
# anything changed. Record where every path the dotfiles packages manage points
# ($HOME/<path> for each <package>/<path> file in the repo) before and after,
# and report a change only if one of them moved.
- name: "Stow dotfiles"
  ansible.builtin.shell: |
    set -euo pipefail
    link_state() {
      find . -mindepth 2 \( -name .git -prune \) -o \( -type f -o -type l \) -print |
        while IFS= read -r f; do
          target="$HOME/${f#./*/}"
          printf '%s\t%s\n' "$target" "$(realpath "$target" 2>/dev/null || echo missing)"
        done | LC_ALL=C sort
    }
    before="$(link_state)"
    ./setup.sh
    after="$(link_state)"
    if [ "$before" != "$after" ]; then echo "DOTFILES_LINKS_CHANGED"; fi
  args:
    chdir: "{{ ansible_facts.env.HOME }}/.dotfiles"
    executable: /bin/bash
  register: stow_dotfiles
  changed_when: "'DOTFILES_LINKS_CHANGED' in stow_dotfiles.stdout"
  tags:
    - dotfiles
