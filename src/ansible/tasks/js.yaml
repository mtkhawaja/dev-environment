---
# Node.js via nvm (cross-platform: macOS + Debian/WSL).

# PROFILE=/dev/null stops the nvm installer from editing rc files —
# the NVM_DIR sourcing lines live in the dotfiles repo (.zshenv).
- name: "Install nvm"
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: "nvm {{ node.nvm_version }}"
    installer_url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ node.nvm_version }}/install.sh"
    installer_creates: "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
    installer_env:
      PROFILE: /dev/null
  tags:
    - initial-setup
    - js

- name: "Install Node via nvm and set the default alias: {{ node.node_version }}"
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install {{ node.node_version }}
    # `--lts` is an install-only flag; the default alias must be a version
    # target. 'lts/*' = the latest LTS line, matching the --lts install above.
    nvm alias default 'lts/*'
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts.env.HOME }}/.nvm/alias/default"
  tags:
    - initial-setup
    - js
