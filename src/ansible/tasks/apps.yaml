---
# Desktop GUI applications (the whole file is skipped when headless; see
# local.yaml). bloom + AeroSpace are macOS-only; VLC, Ghostty and JetBrains
# Toolbox are cross-platform (Homebrew Cask on macOS; apt, or the latest tarball
# for Toolbox, on Debian/WSL).

# Homebrew no longer auto-taps third-party taps (AeroSpace) from a qualified name.
- name: "Add Homebrew taps for GUI apps (macOS)"
  community.general.homebrew_tap:
    name: "{{ apps.brew_taps }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - apps

# Homebrew only loads third-party tap casks that were explicitly trusted.
- name: "List trusted Homebrew entries (macOS)"
  ansible.builtin.command: brew trust --json=v1
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
  register: apps_brew_trust
  changed_when: false
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - apps

- name: "Trust third-party tap casks (macOS)"
  ansible.builtin.command: "brew trust --cask {{ item }}"
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
  loop: "{{ apps.brew_casks | select('search', '/') | list }}"
  changed_when: true
  when:
    - ansible_facts.os_family == "Darwin"
    - item not in (apps_brew_trust.stdout | from_json).casks
  tags:
    - initial-setup
    - apps

# --adopt: take over an identical app already in /Applications (e.g. installed
# by hand) instead of failing on "already an App".
- name: "Install GUI apps via Homebrew Cask (macOS)"
  community.general.homebrew_cask:
    name: "{{ apps.brew_casks }}"
    state: present
    install_options:
      - adopt
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - apps

- name: "Install GUI apps via apt (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ apps.apt_packages }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - apps

# JetBrains Toolbox (macOS): Homebrew adopting an existing copy may need
# `sudo chmod`, which an unattended run can't do, and Toolbox self-updates, so
# only install the cask when the app isn't there yet.
- name: "Check for an existing JetBrains Toolbox app (macOS)"
  ansible.builtin.stat:
    path: "{{ apps.jetbrains_toolbox_app }}"
  register: jetbrains_toolbox_app
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - apps
    - jetbrains-toolbox

- name: "Install JetBrains Toolbox (macOS)"
  community.general.homebrew_cask:
    name: "{{ apps.jetbrains_toolbox_cask }}"
    state: present
  when: ansible_facts.os_family == "Darwin" and not jetbrains_toolbox_app.stat.exists
  tags:
    - initial-setup
    - apps
    - jetbrains-toolbox

- name: "Ensure ~/.local/bin exists (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - apps
    - jetbrains-toolbox

# JetBrains Toolbox (Debian): unpack the latest tarball once and link the
# launcher onto PATH; Toolbox self-installs and self-updates after first launch.
- name: "Create JetBrains Toolbox directory (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/jetbrains-toolbox"
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - apps
    - jetbrains-toolbox

- name: "Install JetBrains Toolbox from tarball (Debian)"
  ansible.builtin.unarchive:
    src: "{{ apps.jetbrains_toolbox_url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/jetbrains-toolbox"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "{{ ansible_facts.env.HOME }}/.local/share/jetbrains-toolbox/bin/jetbrains-toolbox"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - apps
    - jetbrains-toolbox

- name: "Link JetBrains Toolbox onto PATH (Debian)"
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/.local/share/jetbrains-toolbox/bin/jetbrains-toolbox"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/jetbrains-toolbox"
    state: link
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - apps
    - jetbrains-toolbox
