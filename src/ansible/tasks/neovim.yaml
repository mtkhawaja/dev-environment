- name: "Remove neovim source directory if exists (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/neovim"
    state: absent
  when: ansible_facts.os_family == "Debian"
  tags:
    - cleanup
    - initial-setup
    - nvim

- name: "Install Neovim (macOS)"
  community.general.homebrew:
    name: "{{ neovim.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - nvim

- name: "Install Neovim build dependencies (Debian)"
  become: true
  ansible.builtin.apt:
    name:
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - pkg-config
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Clone Neovim (Debian)"
  ansible.builtin.git:
    repo: 'https://github.com/neovim/neovim.git'
    dest: "{{ ansible_facts.env.HOME }}/neovim"
    clone: yes
    update: yes
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Build neovim (Debian)"
  ansible.builtin.command:
    cmd: make -j 20
    chdir: "{{ ansible_facts.env.HOME }}/neovim"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Install neovim (Debian)"
  become: true
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ ansible_facts.env.HOME }}/neovim"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Ensure ~/.local/bin exists (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Install Neovim tooling release binaries: tree-sitter, stylua (Debian)"
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin"
    remote_src: true
    extra_opts: "{{ item.extra_opts }}"
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item.name }}"
  loop: "{{ neovim.release_binaries }}"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim

- name: "Ensure Neovim tooling binaries are executable (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item.name }}"
    mode: '0755'
    state: file
  loop: "{{ neovim.release_binaries }}"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - nvim
