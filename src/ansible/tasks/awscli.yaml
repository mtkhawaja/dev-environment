---
# AWS CLI v2.
#   macOS  -> Homebrew (awscli formula)
#   Debian -> apt (Ubuntu Resolute packages v2)

- name: "Install AWS CLI (macOS)"
  community.general.homebrew:
    name: "{{ awscli.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - awscli

- name: "Install AWS CLI (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ awscli.apt_packages }}"
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - awscli

# AWS's official installer (used before apt shipped v2) puts aws in
# /usr/local/bin, which shadows /usr/bin/aws.
- name: "Remove legacy AWS installer files (Debian)"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/aws
    - /usr/local/bin/aws_completer
    - /usr/local/aws-cli
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cleanup
    - awscli
