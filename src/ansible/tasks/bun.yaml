---
# Bun (cross-platform: macOS + Debian/WSL). Official installer -> ~/.bun.

# Bun PATH + completions live in the dotfiles repo (.zshenv / .zshrc), not here.
# Bun's installer skips editing rc files when its bin dir is already on PATH,
# so we prepend it for the install to stop it mutating the (symlinked) dotfiles.

- name: "Install Bun"
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: Bun
    installer_url: https://bun.sh/install
    installer_creates: "{{ ansible_facts.env.HOME }}/.bun/bin/bun"
    installer_env:
      PATH: "{{ ansible_facts.env.HOME }}/.bun/bin:{{ ansible_facts.env.PATH }}"
    installer_reset_paths:
      - "{{ ansible_facts.env.HOME }}/.bun"
  tags:
    - initial-setup
    - bun
