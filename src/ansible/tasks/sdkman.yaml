---
# Run the installer under zsh on macOS (bash 3.2 there trips SDKMAN's bash-4
# gate; zsh skips it). Debian uses bash 5.x. See sdkman_shell in vars/main.yml.
# Shell init (sourcing sdkman-init.sh) lives in the dotfiles repo (.zshenv), not here.
- name: Install SDKMAN
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: SDKMAN
    installer_url: https://get.sdkman.io
    installer_creates: "{{ ansible_facts.env.HOME }}/.sdkman/bin/sdkman-init.sh"
    installer_shell: "{{ sdkman_shell }}"
