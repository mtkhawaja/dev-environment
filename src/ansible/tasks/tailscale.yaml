---
# Tailscale (Linux only, opt-in). Imported by local.yaml only with
# `-e tailscale=true`, or run via the standalone tailscale.yaml playbook.
#   Debian -> Tailscale's official apt repo (deb822 .sources), tailscaled enabled
#   macOS  -> not managed

- name: "Ensure python3-debian is present for deb822_repository (Debian)"
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - tailscale

- name: "Add Tailscale apt repository (Debian)"
  become: true
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "{{ tailscale_apt.repo_base }}"
    suites: "{{ tailscale_apt.suite }}"
    components: main
    signed_by: "{{ tailscale_apt.repo_base }}/{{ tailscale_apt.suite }}.asc"
  when: ansible_facts.os_family == "Debian"
  tags:
    - tailscale

- name: "Install Tailscale (Debian)"
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - tailscale

- name: "Enable and start tailscaled (Debian)"
  become: true
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
  when:
    - ansible_facts.os_family == "Debian"
    - ansible_facts.service_mgr == "systemd"
  tags:
    - tailscale

- name: "Check Tailscale connection state (Debian)"
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == "Debian"
  tags:
    - tailscale

# Joins only when TS_AUTHKEY is set and the node isn't connected yet. The key
# goes through a root-only 0600 temp file (`--auth-key=file:`), never argv, and
# no_log keeps it out of output; on failure, run `sudo tailscale up` by hand.
- name: "Join the tailnet with TS_AUTHKEY (Debian)"
  when:
    - ansible_facts.os_family == "Debian"
    - tailscale_authkey | length > 0
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  tags:
    - tailscale
  block:
    - name: "Create a root-only temp file for the auth key (Debian)"
      become: true
      ansible.builtin.tempfile:
        state: file
        suffix: -tailscale-authkey
      register: tailscale_keyfile

    - name: "Write the auth key (Debian)"
      become: true
      ansible.builtin.copy:
        content: "{{ tailscale_authkey }}"
        dest: "{{ tailscale_keyfile.path }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: "Run tailscale up (Debian)"
      become: true
      ansible.builtin.command: "tailscale up --auth-key=file:{{ tailscale_keyfile.path }} {{ tailscale_up_args }}"
      no_log: true
      changed_when: true
  always:
    - name: "Remove the auth key file (Debian)"
      become: true
      ansible.builtin.file:
        path: "{{ tailscale_keyfile.path }}"
        state: absent
      when: tailscale_keyfile.path is defined

- name: "Explain how to join the tailnet (Debian)"
  ansible.builtin.debug:
    msg: "Tailscale is installed but not connected. Run `sudo tailscale up` (or re-run with TS_AUTHKEY set)."
  when:
    - ansible_facts.os_family == "Debian"
    - tailscale_authkey | length == 0
    - (tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  tags:
    - tailscale
