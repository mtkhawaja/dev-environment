---
# Modern CLI tools.
#   macOS  -> Homebrew (all formulae)
#   Debian -> apt (all packaged in Ubuntu Resolute)

# ---------- macOS ----------
- name: "Install modern CLI tools (macOS)"
  community.general.homebrew:
    name: "{{ modern_cli.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - modern-cli

# ---------- Debian / WSL ----------
- name: "Install modern CLI tools (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ modern_cli.apt_packages }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - modern-cli

# Release binaries from before the apt migration would shadow the apt ones
# (~/.local/bin is first on PATH).
- name: "Remove legacy release binaries (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
    state: absent
  loop: [lazygit, dust, sd, procs]
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cleanup
    - modern-cli
