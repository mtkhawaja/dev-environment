---
# Shared cross-platform configuration. Loaded by local.yaml via vars_files.
#
# Versions are NOT pinned: every tool installs the latest release available at
# install time (package managers unpinned, `releases/latest/download/...` URLs,
# or a "latest" lookup at runtime). Re-runs don't upgrade (idempotent `creates:`).
# "Latest" lookups never use the GitHub REST API: anonymous calls are limited to
# 60/hour per IP, which shared CI runners and NAT'd networks exhaust (it broke
# the macOS CI job). They use GitHub web redirects, the npm registry, or vendor
# indexes instead, and only run when the tool isn't installed yet.

# Server installs without a desktop: `-e headless=true` (or HEADLESS=true for
# setup.sh) skips GUI apps and desktop-only packages. Always test it with
# `headless | bool` — extra vars arrive as strings, so "false" is truthy.
headless: false

# Linux CPU arch, in the two spellings release assets use. Ubuntu reports
# x86_64/aarch64; macOS reports x86_64/arm64.
linux_arch: "{{ 'aarch64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'x86_64' }}"
deb_arch: "{{ 'arm64' if linux_arch == 'aarch64' else 'amd64' }}"

modern_cli:
  # macOS: install everything through Homebrew (handles arch automatically).
  brew_formulae:
    - git-delta
    - lazygit
    - dust
    - duf
    - procs
    - sd
    - hyperfine

  # Debian/WSL: all packaged in Ubuntu Resolute universe (any arch).
  apt_packages:
    - hyperfine
    - duf
    - git-delta
    - lazygit
    - du-dust
    - procs
    - sd

# ---------- SP2/SP3 cross-platform package data ----------

core:
  # macOS: gnupg for key handling + pinentry-mac for the native GPG passphrase
  # dialog (the dotfiles' gpg-agent setup prefers it). locales/ca-certs are native.
  brew_formulae:
    - gnupg
    - pinentry-mac
  # macOS powerline glyphs come from a nerd-font cask (installed separately).
  brew_cask_fonts:
    - font-meslo-lg-nerd-font

shell:
  brew_formulae:
    - zsh

dotfiles:
  brew_formulae:
    - stow

tools:
  # Debian apt list (moved verbatim out of tools.yaml).
  apt_packages:
    - tmux
    - jq
    # tealdeer: Rust tldr client (ships `tldr`); the `tldr` package is gone in 26.04.
    - tealdeer
    - eza
    - fzf
    - curl
    - wget
    - btop
    - lsof
    - unzip
    - zip
    - gettext
    - tofrodos
    - fastfetch
    - rsync
    - tree
    - expect
    - bat
    - ripgrep
    - shellcheck
  # Desktop-only helpers (X11 clipboard); not installed directly when headless
  # (Neovim and Yazi still pull xclip in as a recommended package).
  apt_desktop_packages:
    - xclip
  apt_build_tools:
    - build-essential
    - cmake
    - pkg-config
    - libpthread-stubs0-dev
    - lua5.1
    - libtool
    - libtool-bin
    - ninja-build
  # macOS: brew names (built-ins curl/zip/unzip/lsof/rsync/man omitted;
  # X11-only xclip omitted -> pbcopy/pbpaste; tofrodos -> dos2unix;
  # build-essential -> Xcode CLT assumed present).
  # neofetch -> fastfetch: neofetch is discontinued upstream and was removed
  # from Homebrew (and Ubuntu 26.04); fastfetch is its maintained drop-in successor.
  brew_formulae:
    - tmux
    - jq
    - fzf
    - wget
    - btop
    - gettext
    - tealdeer
    - fastfetch
    - tree
    - expect
    - bat
    - ripgrep
    - eza
    - dos2unix
    - cmake
    - ninja
    - pkg-config
    - libtool
    - lua
    - shellcheck

# Desktop GUI apps (skipped when headless). bloom + AeroSpace are macOS-only (no
# Linux equivalent in this dev-env); VLC and Ghostty are cross-platform
# (Homebrew Cask on macOS, apt on Debian — Ubuntu's archive packages Ghostty);
# JetBrains Toolbox is a cask on macOS and the latest tarball on Debian.
apps:
  brew_taps:
    - nikitabobko/tap
  brew_casks:
    - bloom
    - nikitabobko/tap/aerospace
    - vlc
    - ghostty
  apt_packages:
    - vlc
    - ghostty
  # JetBrains Toolbox on macOS: cask, installed only when the app is absent
  # (adopting an existing copy can need sudo; Toolbox self-updates anyway).
  jetbrains_toolbox_cask: jetbrains-toolbox
  jetbrains_toolbox_app: "/Applications/JetBrains Toolbox.app"
  # JetBrains Toolbox on Debian: no apt/.deb; JetBrains' download endpoint
  # redirects to the latest tarball (bundles its own JRE) per arch. It
  # self-installs and self-updates on first launch.
  jetbrains_toolbox_url: "https://data.services.jetbrains.com/products/download?code=TBA&platform={{ 'linuxARM64' if deb_arch == 'arm64' else 'linux' }}"

# jdtls (Eclipse JDT Language Server, Java LSP). macOS: Homebrew formula.
# Debian: no apt package, so install the latest Eclipse milestone tarball
# (arch-independent, pure Java): newest version directory listed on Eclipse's
# milestones index, then that milestone's latest.txt names the tarball (its
# filename embeds a build timestamp).
jdtls:
  brew_formulae:
    - jdtls
  milestones_url: "https://download.eclipse.org/jdtls/milestones"

neovim:
  # tree-sitter-cli compiles treesitter parsers (nvim-treesitter `main`); stylua formats the Lua config.
  brew_formulae:
    - neovim
    - tree-sitter-cli
    - stylua
  apt_packages:
    - neovim
  # Debian/WSL: release zips (files at root, hence -j) into ~/.local/bin.
  # tree-sitter (latest) is a release binary: Resolute's apt tree-sitter-cli (0.25.9)
  # is below nvim-treesitter main's minimum (0.26.1). stylua has no apt package.
  tree_sitter_asset: "tree-sitter-cli-linux-{{ 'arm64' if deb_arch == 'arm64' else 'x64' }}.zip"
  release_binaries:
    - name: tree-sitter
      url: "https://github.com/tree-sitter/tree-sitter/releases/latest/download/{{ neovim.tree_sitter_asset }}"
    - name: stylua
      url: "https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-{{ linux_arch }}.zip"

# Go. macOS: Homebrew. Debian: always the latest go.dev release (arch-aware),
# re-extracted into /usr/local/go only when go.dev reports a newer version.
go:
  brew_formulae:
    - go
  latest_version_url: "https://go.dev/VERSION?m=text"

# OpenTofu (Terraform fork). Unpinned on both platforms to track latest.
# macOS: Homebrew formula. Debian: no Ubuntu package, so add OpenTofu's official
# apt repo and install `tofu`. Only the repo key signs the repo's InRelease.
opentofu:
  brew_formulae:
    - opentofu
  apt_repo_uri: "https://packages.opentofu.org/opentofu/tofu/any/"
  apt_repo_key_url: "https://packages.opentofu.org/opentofu/tofu/gpgkey"

# AWS CLI v2. macOS: Homebrew formula. Debian: Ubuntu Resolute packages v2.
awscli:
  brew_formulae:
    - awscli
  apt_packages:
    - awscli

bitwarden:
  brew_formulae:
    - bitwarden-cli
  # Debian/WSL: no apt package; latest CLI release zip (single `bw` binary). The
  # repo's GitHub "latest" release is the desktop app, so the CLI version comes
  # from npm's @bitwarden/cli (published with each CLI release) at install time.
  npm_latest_url: "https://registry.npmjs.org/@bitwarden/cli/latest"
  linux_asset: "bw-linux{{ '-arm64' if deb_arch == 'arm64' else '' }}-{{ bw_version }}.zip"
  linux_url: "https://github.com/bitwarden/clients/releases/download/cli-v{{ bw_version }}/{{ bitwarden.linux_asset }}"

yazi:
  # Debian/WSL: no Ubuntu package; upstream ships a .deb per arch (tracks latest).
  deb_url: "https://github.com/sxyazi/yazi/releases/latest/download/yazi-{{ linux_arch }}-unknown-linux-gnu.deb"
  apt_packages:
    - ffmpeg
    - 7zip   # p7zip-full is only a virtual package on 26.04
    - poppler-utils
    - fd-find
    - ripgrep
    - fzf
    - zoxide
    - imagemagick
  brew_formulae:
    - yazi
    - ffmpeg
    - sevenzip
    - poppler
    - fd
    - ripgrep
    - fzf
    - zoxide
    - imagemagick

# Python is managed by uv (Astral), which downloads prebuilt standalone Pythons —
# no system build dependencies needed, so there's no python: package data here.

# Shell used to run the SDKMAN installer and `sdk` commands. macOS ships only
# bash 3.2, and SDKMAN's installer hard-requires bash 4+ — BUT that check is
# guarded by `[ -n "$BASH_VERSION" ]`, so running under zsh (always present on
# macOS, and SDKMAN supports it) skips the gate entirely. Debian's /bin/bash is
# already 5.x, so it stays on bash. Evaluated lazily against runtime facts.
sdkman_shell: "{{ '/bin/zsh' if ansible_facts.os_family == 'Darwin' else '/bin/bash' }}"

node:
  # nvm: latest release tag read from GitHub's web redirect (js.yaml).
  nvm_latest_url: "https://github.com/nvm-sh/nvm/releases/latest"
  node_version: "--lts"

# tflint (Terraform linter). No Homebrew/apt package — both OSes install the
# latest upstream release zip (arm64 or amd64) into ~/.local/bin.
tflint:
  url: "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_{{ ansible_facts.system | lower }}_{{ deb_arch }}.zip"

# GitHub CLI (gh). macOS: Homebrew. Debian: GitHub's official apt repo —
# Ubuntu's own `gh` package (2.46 on Resolute) lags upstream by years.
github_cli:
  brew_formulae:
    - gh
  apt_repo_uri: "https://cli.github.com/packages"
  apt_repo_key_url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"

# SonarQube CLI (`sonar`). macOS: Homebrew cask (Apple Silicon only). Debian: no
# apt/.deb; latest single binary from SonarSource's CDN into ~/.local/bin. (Their
# install script would append a PATH line to the stowed ~/.zshrc, so it's not used.)
sonarqube_cli:
  brew_casks:
    - sonarqube-cli
  # Latest stable version is read from stable.version at install time (sonar_version).
  base_url: "https://binaries.sonarsource.com/Distribution/sonarqube-cli"
  linux_platform: "linux-{{ 'arm64' if deb_arch == 'arm64' else 'x86-64' }}"
  linux_url: "{{ sonarqube_cli.base_url }}/{{ sonar_version }}/linux/sonarqube-cli-{{ sonar_version }}-{{ sonarqube_cli.linux_platform }}.bin"

# Atlassian CLI (acli). macOS: Atlassian's Homebrew tap. Debian: Atlassian's apt repo.
acli:
  brew_tap: atlassian/acli
  brew_formulae:
    - atlassian/acli/acli
  apt_repo_uri: "https://acli.atlassian.com/linux/deb"
  apt_repo_key_url: "https://acli.atlassian.com/gpg/public-key.asc"

# Headless browser testing (Playwright / Selenium, Chrome-based) on Linux servers.
# Linux ONLY by design: browsers on macOS are deliberately not managed here,
# so there is no Darwin branch.
# Google Chrome stable (amd64/arm64) gives Selenium a system browser and pulls
# in the shared libraries Chromium needs; projects then only run
# `playwright install` (no sudo / --with-deps).
browser_testing:
  chrome_apt_repo_uri: "https://dl.google.com/linux/chrome/deb/"
  chrome_apt_repo_key_url: "https://dl.google.com/linux/linux_signing_key.pub"
  apt_packages:
    - google-chrome-stable
    - fonts-liberation
    - fonts-noto-color-emoji
    - xvfb            # only for tests that must run headed: xvfb-run <cmd>

# SSH. Regular install (Linux): the client only — minimal images ship without
# one. The server is opt-in via the standalone ssh-server.yaml playbook, which
# installs it already hardened (key-only, no root). macOS: nothing — the client
# is built in and Remote Login stays off.
ssh:
  apt_client_packages:
    - openssh-client
  apt_server_packages:
    - openssh-server
  # Ubuntu runs sshd via socket activation (ssh.socket listens on :22).
  server_unit: ssh.socket
  user: "{{ ansible_facts.user_id }}"
  authorized_keys_file: "{{ ansible_facts.user_dir }}/.ssh/authorized_keys"
  hardening_dropin: /etc/ssh/sshd_config.d/10-dev-env-hardening.conf

# ssh-server.yaml: public key(s) to authorize before installing the server —
# a key line or a URL such as https://github.com/<user>.keys. Optional if
# ~/.ssh/authorized_keys already holds a key.
ssh_authorized_keys: ""

# Tailscale (Linux only, opt-in): never runs by default. Either run the
# standalone `tailscale.yaml` playbook, or pass `-e tailscale=true` to local.yaml.
# Joining the tailnet is automatic only when TS_AUTHKEY is set in the
# environment; the key reaches `tailscale up` via a root-only temp file
# (`--auth-key=file:`), never argv or logs. Otherwise run `sudo tailscale up`.
tailscale: false
tailscale_apt:
  repo_base: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}"
  suite: "{{ ansible_facts.distribution_release }}"
tailscale_authkey: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"
tailscale_up_args: ""   # extra `tailscale up` flags, e.g. "--ssh --advertise-tags=tag:server"

# Automatic updates (Linux, desktop and server; regular install). Daily
# unattended-upgrades, rebooting only when an update requires it, at
# reboot_time (local), even with users logged in.
auto_updates:
  reboot_time: "04:00"
  # Added to Ubuntu's default Allowed-Origins (security + ESM): regular Ubuntu
  # updates, plus the third-party apt repos this playbook configures.
  origins_patterns:
    - "origin=Ubuntu,archive=${distro_codename}-updates"
    - "origin=LP-PPA-ansible-ansible"   # Ansible PPA (setup.sh)
    - "site=dl.google.com"              # Google Chrome (browser-testing)
    - "site=cli.github.com"             # GitHub CLI
    - "site=acli.atlassian.com"         # Atlassian CLI
    - "site=packages.opentofu.org"      # OpenTofu
    - "site=pkgs.tailscale.com"         # Tailscale (opt-in)
  config_file: /etc/apt/apt.conf.d/52dev-env-auto-updates
