---
# GitHub CLI (gh).
#   macOS  -> Homebrew
#   Debian -> GitHub's official apt repo (deb822 .sources), `gh` package

- name: "Install GitHub CLI (macOS)"
  community.general.homebrew:
    name: "{{ github_cli.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - gh

- name: "Ensure python3-debian is present for deb822_repository (Debian)"
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - gh

- name: "Add GitHub CLI apt repository (Debian)"
  become: true
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: "{{ github_cli.apt_repo_uri }}"
    suites: stable
    components: main
    signed_by: "{{ github_cli.apt_repo_key_url }}"
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - gh
  register: gh_repo
  retries: 3
  delay: 30
  until: gh_repo is succeeded

- name: "Install GitHub CLI (Debian)"
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - gh
