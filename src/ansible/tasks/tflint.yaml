---
# tflint (Terraform linter). No Homebrew/apt package, so both OSes install the
# latest upstream release zip (arm64 or amd64) into ~/.local/bin.

- name: "Ensure unzip is available (Debian)"
  become: true
  ansible.builtin.apt:
    name: unzip
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - tflint

- name: "Ensure ~/.local/bin exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  tags:
    - initial-setup
    - tflint

- name: "Install tflint from release zip"
  ansible.builtin.unarchive:
    src: "{{ tflint.url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin"
    remote_src: true
    extra_opts: ["-j"]
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/tflint"
  tags:
    - initial-setup
    - tflint

- name: "Ensure tflint binary is executable"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/tflint"
    mode: '0755'
    state: file
  tags:
    - initial-setup
    - tflint
