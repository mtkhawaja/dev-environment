---
# Bitwarden CLI (bw).
#   macOS  -> Homebrew
#   Debian -> latest CLI release zip (amd64 or arm64)

- name: "Ensure unzip is available for .zip release archives (Debian)"
  become: true
  ansible.builtin.apt:
    name: unzip
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - bitwarden

- name: "Check for an existing Bitwarden CLI (Debian)"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/tools/bitwarden/bin/bw"
  register: bw_bin
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - bitwarden

- name: "Install the latest Bitwarden CLI (Debian)"
  when: ansible_facts.os_family == "Debian" and not bw_bin.stat.exists
  tags:
    - initial-setup
    - bitwarden
  block:
    - name: "Look up Bitwarden releases (Debian)"
      ansible.builtin.uri:
        url: "{{ bitwarden.releases_api }}"
        return_content: true
      register: bw_releases

    # The repo also releases desktop/browser/web apps; take the newest CLI one.
    - name: "Resolve the newest Bitwarden CLI release (Debian)"
      ansible.builtin.set_fact:
        bw_version: >-
          {{ bw_releases.json | rejectattr('prerelease') | map(attribute='tag_name')
             | select('match', '^cli-v') | first | regex_replace('^cli-v', '') }}

    - name: "Ensure bitwarden directories exist"
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/bin/tools/bitwarden/bin"
        state: directory
        mode: '0755'

    - name: "Download and install Bitwarden CLI"
      ansible.builtin.unarchive:
        src: "{{ bitwarden.linux_url }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/tools/bitwarden/bin"
        remote_src: true
        mode: '0755'
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/tools/bitwarden/bin/bw"
        extra_opts:
          - "-j"  # Extract just the files without directory structure

- name: "Install Bitwarden CLI (macOS)"
  community.general.homebrew:
    name: "{{ bitwarden.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - bitwarden
