- name: "Install common CLI tools (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ tools.apt_packages }}"
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cli-tools

# eza now comes from Ubuntu's own archive (tools.apt_packages); drop the
# third-party gierens repo older runs added.
- name: "Remove legacy eza apt repository (Debian)"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/gierens.list
    - /etc/apt/keyrings/gierens.gpg
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cleanup
    - cli-tools
    - eza

- name: "Install desktop CLI helpers (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ tools.apt_desktop_packages }}"
    state: present
  when: ansible_facts.os_family == "Debian" and not (headless | bool)
  tags:
    - initial-setup
    - cli-tools

- name: "Install man pages (Debian)"
  become: true
  ansible.builtin.apt:
    name:
      - "man-db"
      - "manpages-posix"
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cli-tools

- name: "Install build tools (Debian)"
  become: true
  ansible.builtin.apt:
    name: "{{ tools.apt_build_tools }}"
    state: present
  when: ansible_facts.os_family == "Debian"
  tags:
    - initial-setup
    - cli-tools

# tealdeer replaces the tldr C client; both ship bin/tldr. The tldr formula is
# gone from homebrew-core (so the homebrew module errors on it), but an
# existing keg can still be uninstalled with brew directly.
- name: "Check for the legacy tldr formula (macOS)"
  ansible.builtin.command: brew list --formula tldr
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
  register: legacy_tldr
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - cli-tools
    - tealdeer

- name: "Uninstall the legacy tldr formula (macOS)"
  ansible.builtin.command: brew uninstall --formula tldr
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
  changed_when: true
  when: ansible_facts.os_family == "Darwin" and legacy_tldr.rc == 0
  tags:
    - initial-setup
    - cli-tools
    - tealdeer

- name: "Install CLI tools (macOS)"
  community.general.homebrew:
    name: "{{ tools.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - initial-setup
    - cli-tools

# tealdeer ships without pages; fetch them once. `--list` prints nothing (or
# fails) until the cache holds pages.
- name: "Check for a populated tldr page cache"
  ansible.builtin.command: tldr --list
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
  register: tldr_list
  changed_when: false
  failed_when: false
  tags:
    - initial-setup
    - cli-tools
    - tealdeer

- name: "Download tldr pages"
  ansible.builtin.command: tldr --update
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
  when: tldr_list.rc != 0 or tldr_list.stdout | length == 0
  changed_when: true
  tags:
    - initial-setup
    - cli-tools
    - tealdeer
