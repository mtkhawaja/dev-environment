---
# Python toolchain via uv (Astral) — cross-platform (macOS + Debian/WSL).
# uv downloads prebuilt standalone Pythons, so no system build dependencies are
# needed. uv's PATH/completions live in the dotfiles repo, not here, so the
# installer runs with UV_NO_MODIFY_PATH=1.

- name: "Install uv (Astral)"
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: uv
    installer_url: https://astral.sh/uv/install.sh
    installer_creates: "{{ ansible_facts.env.HOME }}/.local/bin/uv"
    installer_shell: sh
    installer_env:
      UV_NO_MODIFY_PATH: "1"
  tags:
    - initial-setup
    - python
    - uv

# Default Python: the latest python.version patch release via uv. uv is updated
# first so it always knows the newest releases.
- name: "Update uv"
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/uv self update"
  register: uv_self_update
  changed_when: "'Upgraded' in uv_self_update.stderr"
  retries: 3
  delay: 30
  until: uv_self_update is succeeded
  tags:
    - initial-setup
    - python

- name: "Install the latest Python and make it the default: {{ python.version }}"
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/uv python install --default {{ python.version }}"
  register: python_default
  changed_when: "'Installed' in python_default.stderr"
  retries: 3
  delay: 30
  until: python_default is succeeded
  tags:
    - initial-setup
    - python

- name: "Install global Python CLI tools via uv"
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/uv tool install {{ item }}"
  loop:
    - ruff
    - mypy
    - pyright
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
  tags:
    - initial-setup
    - python
