---
# Reinstall oh-my-zsh from scratch. ~/.zshrc and ~/.zshenv are deliberately left
# alone: they are dotfiles symlinks, and the dotfiles setup backs up any real
# files before stowing. Deleting them here left the shell broken whenever stow
# later failed.
- name: "Remove existing oh-my-zsh install"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
    state: absent
  tags:
    - cleanup-zsh-config

- name: "Check if zsh is installed"
  ansible.builtin.command: which zsh
  register: is_zsh_installed
  changed_when: false
  failed_when: false
  tags:
    - initial-setup
    - zsh

- name: "Install zsh (Debian)"
  become: true
  ansible.builtin.apt:
    name: zsh
    state: present
  when: is_zsh_installed.rc != 0 and ansible_facts.os_family == "Debian"
  tags:
    - install-zsh

- name: "Install zsh (macOS)"
  community.general.homebrew:
    name: "{{ shell.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - install-zsh

# KEEP_ZSHRC=yes: never replace an existing (stowed) ~/.zshrc with the template.
- name: "Install oh-my-zsh"
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: oh-my-zsh
    installer_url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    installer_creates: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
    installer_shell: sh
    installer_env:
      KEEP_ZSHRC: "yes"
    installer_reset_paths:
      - "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
  tags:
    - oh-my-zsh-setup

- name: "Download zsh-autosuggestions plugin"
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: master
    clone: true
    update: true
  tags:
    - oh-my-zsh-setup
  register: zsh_autosuggestions_clone
  retries: 3
  delay: 30
  until: zsh_autosuggestions_clone is succeeded

- name: "Download zsh-syntax-highlighting plugin"
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    version: master
    clone: true
    update: true
  tags:
    - oh-my-zsh-setup
  register: zsh_syntax_highlighting_clone
  retries: 3
  delay: 30
  until: zsh_syntax_highlighting_clone is succeeded
