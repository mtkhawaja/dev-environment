---
# Node.js via nvm (cross-platform: macOS + Debian/WSL).

# nvm's installer is versioned, so read the latest release tag from GitHub's
# web redirect first (not the rate-limited REST API; only when nvm isn't
# installed yet).
- name: "Check for an existing nvm install"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
  register: nvm_sh
  tags:
    - initial-setup
    - js

- name: "Look up the latest nvm release"
  ansible.builtin.uri:
    url: "{{ node.nvm_latest_url }}"
    follow_redirects: none
    status_code: 302
  register: nvm_latest
  when: not nvm_sh.stat.exists
  tags:
    - initial-setup
    - js
  retries: 3
  delay: 30
  until: nvm_latest is succeeded

# PROFILE=/dev/null stops the nvm installer from editing rc files —
# the NVM_DIR sourcing lines live in the dotfiles repo (.zshenv).
- name: "Install nvm"
  ansible.builtin.import_tasks: common/install-script.yaml
  vars:
    installer_name: nvm
    installer_url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_latest.location | basename }}/install.sh"
    installer_creates: "{{ ansible_facts.env.HOME }}/.nvm/nvm.sh"
    installer_env:
      PROFILE: /dev/null
    installer_reset_paths:
      - "{{ ansible_facts.env.HOME }}/.nvm"
  tags:
    - initial-setup
    - js

# Default Node: the newest release of node.version (nvm resolves the major).
- name: "Install Node and make it the default: {{ node.version }}"
  ansible.builtin.shell:
    cmd: |
      . "$HOME/.nvm/nvm.sh"
      nvm install {{ node.version }}
      nvm alias default {{ node.version }}
    executable: /bin/bash
  register: node_default
  changed_when: "'is already installed' not in (node_default.stdout + node_default.stderr)"
  retries: 3
  delay: 30
  until: node_default is succeeded
  tags:
    - initial-setup
    - js
