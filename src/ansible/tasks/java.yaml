---
# Java installation via SDKMAN

- name: "Install Java 21 (LTS) via SDKMAN"
  ansible.builtin.shell: |
    source {{ ansible_facts.env.HOME }}/.sdkman/bin/sdkman-init.sh && sdk install java 21-tem
  args:
    executable: "{{ sdkman_shell }}"
  register: java_install_result
  changed_when: "'is already installed' not in java_install_result.stdout"
  tags:
    - java
    - sdkman

- name: "Install Java development tools via SDKMAN"
  ansible.builtin.shell: |
    source {{ ansible_facts.env.HOME }}/.sdkman/bin/sdkman-init.sh && sdk install {{ item }}
  args:
    executable: "{{ sdkman_shell }}"
  loop:
    - maven
    - gradle
  register: tool_install_result
  changed_when: "'is already installed' not in tool_install_result.stdout"
  tags:
    - java
    - sdkman

# jdtls (Eclipse JDT Language Server, Java LSP).
- name: "Install jdtls (macOS)"
  community.general.homebrew:
    name: "{{ jdtls.brew_formulae }}"
    state: present
  when: ansible_facts.os_family == "Darwin"
  tags:
    - java
    - jdtls

# Debian: no apt package. Extract the latest arch-independent Eclipse milestone
# into ~/.local/share/jdtls and symlink its bin/jdtls launcher onto PATH. The
# launcher needs python3 (system) + java (SDKMAN, above).
- name: "Check for an existing jdtls install (Debian)"
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/share/jdtls/bin/jdtls"
  register: jdtls_bin
  when: ansible_facts.os_family == "Debian"
  tags:
    - java
    - jdtls

- name: "Install the latest jdtls milestone (Debian)"
  when: ansible_facts.os_family == "Debian" and not jdtls_bin.stat.exists
  tags:
    - java
    - jdtls
  block:
    - name: "Read the jdtls milestones index (Debian)"
      ansible.builtin.uri:
        url: "{{ jdtls.milestones_url }}/"
        return_content: true
      register: jdtls_index

    - name: "Resolve the newest jdtls milestone (Debian)"
      ansible.builtin.set_fact:
        jdtls_version: >-
          {{ jdtls_index.content | regex_findall('milestones/([0-9]+[.][0-9]+[.][0-9]+)')
             | unique | community.general.version_sort | last }}

    - name: "Find that milestone's tarball (Debian)"
      ansible.builtin.uri:
        url: "{{ jdtls.milestones_url }}/{{ jdtls_version }}/latest.txt"
        return_content: true
      register: jdtls_latest_txt

    - name: "Create jdtls install directory (Debian)"
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.local/share/jdtls"
        state: directory
        mode: '0755'

    - name: "Download and extract jdtls (Debian)"
      ansible.builtin.unarchive:
        src: "{{ jdtls.milestones_url }}/{{ jdtls_version }}/{{ jdtls_latest_txt.content | trim }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/jdtls"
        remote_src: true
        creates: "{{ ansible_facts.env.HOME }}/.local/share/jdtls/bin/jdtls"

- name: "Ensure ~/.local/bin exists (Debian)"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  when: ansible_facts.os_family == "Debian"
  tags:
    - java
    - jdtls

- name: "Symlink jdtls launcher onto PATH (Debian)"
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/.local/share/jdtls/bin/jdtls"
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/jdtls"
    state: link
  when: ansible_facts.os_family == "Debian"
  tags:
    - java
    - jdtls
